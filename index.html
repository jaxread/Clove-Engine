<section class="box" aria-labelledby="download-heading">
  <h2 id="download-heading">Download</h2>
  <p>Download the latest version of Clove Engine:</p>

  <div class="actions">
    <a class="btn" href="https://github.com/jaxread/Clove-Engine/archive/refs/tags/CloveEngine-1.0.zip"
       rel="noopener noreferrer"
       aria-label="Download latest release zip">
      Download (Latest release)
    </a>
  </div>

  <script>
  // Replace the static zip link with the actual latest release asset (zip) at runtime.
  // Keeps the original link as a fallback if the API call fails or there's no .zip asset.
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const anchor = document.querySelector('a[aria-label="Download latest release zip"]');
      if (!anchor) return;

      const resp = await fetch('https://api.github.com/repos/jaxread/Clove-Engine/releases/latest');
      if (!resp.ok) return;
      const release = await resp.json();

      // Prefer a provided .zip asset (the release attachments). If none, fall back to the
      // autogenerated source zip for the tag (tag_name).
      const assets = Array.isArray(release.assets) ? release.assets : [];
      const zipAsset = assets.find(a => a && a.name && a.name.toLowerCase().endsWith('.zip'));

      let downloadUrl = null;
      if (zipAsset && zipAsset.browser_download_url) {
        downloadUrl = zipAsset.browser_download_url;
      } else if (release.tag_name) {
        // Use the repository source zip for the tag (this will download the source archive for the tag)
        downloadUrl = `https://github.com/jaxread/Clove-Engine/archive/refs/tags/${encodeURIComponent(release.tag_name)}.zip`;
      }

      if (downloadUrl) {
        anchor.setAttribute('href', downloadUrl);
        // Keep rel and aria-label as-is. Do not change visible text so website look is preserved.
      }
    } catch (err) {
      // Silent fail to avoid changing site behavior; keep original href as fallback.
      console.error('Error fetching latest release for download button:', err);
    }
  });
  </script>
</section>
