<script>
document.addEventListener('DOMContentLoaded', async () => {
  const anchor = document.querySelector('a[aria-label="Download latest release zip"]');
  if (!anchor) return;

  try {
    // Small timeout so slow API calls don't hang page load
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    const resp = await fetch('https://api.github.com/repos/jaxread/Clove-Engine/releases/latest', { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!resp.ok) return;

    const release = await resp.json();
    const assets = Array.isArray(release.assets) ? release.assets : [];

    // Prefer an attached .zip asset; otherwise fall back to the autogenerated tag zip
    const zipAsset = assets.find(a => a && typeof a.name === 'string' && a.name.toLowerCase().endsWith('.zip'));
    let downloadUrl = null;

    if (zipAsset && zipAsset.browser_download_url) {
      downloadUrl = zipAsset.browser_download_url;
    } else if (release.tag_name) {
      downloadUrl = `https://github.com/jaxread/Clove-Engine/archive/refs/tags/${encodeURIComponent(release.tag_name)}.zip`;
    }

    if (downloadUrl) {
      anchor.setAttribute('href', downloadUrl);
      // leave rel, aria-label and visible text unchanged so site appearance is preserved
    }
  } catch (err) {
    // Fail silently so the original hard-coded link remains as a fallback
    console.debug('Failed to update download link:', err);
  }
});
</script>
