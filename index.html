<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clove Engine</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    h1 { margin-bottom: 0.25rem; }
    p  { color: #9aa0a6; margin-top: 0; }
    .download-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.85rem 1.6rem;
      background: #4f7cff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .download-btn:hover { background: #3a63d8; }

    .code-btn {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .code-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.75);
      padding: 2rem;
      box-sizing: border-box;
    }

    .code-modal.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-window {
      width: min(1100px, 95vw);
      height: min(800px, 90vh);
      background: #181b22;
      border: 1px solid #303642;
      border-radius: 10px;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      background: #222631;
      border-bottom: 1px solid #303642;
    }

    .code-header button {
      border: 0;
      background: transparent;
      color: #e6e6e6;
      font-size: 1.7rem;
      line-height: 1;
      cursor: pointer;
    }

    .code-window pre {
      height: calc(100% - 55px);
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      overflow: auto;
      white-space: pre;
      color: #d8dee9;
      font: 13px/1.55 Consolas, "Cascadia Code", monospace;
    }
  </style>
</head>
<body>
  <h1>Clove Engine</h1>
  <p>Download the latest release below.</p>

  <!-- Hardcoded fallback so a button ALWAYS shows, even if the API call fails -->
  <a
    class="download-btn"
    aria-label="Download latest release zip"
    rel="noopener"
    href="https://github.com/jaxread/Clove-Engine/releases/latest"
  >Download Latest Release</a>


  <button id="view-code-btn" class="download-btn code-btn" type="button">
    View Code
  </button>

  <div id="code-modal" class="code-modal" aria-hidden="true">
    <div class="code-window">
      <div class="code-header">
        <strong>index.html</strong>
        <button id="close-code-btn" type="button" aria-label="Close code viewer">×</button>
      </div>
      <pre><code id="source-code"></code></pre>
    </div>
  </div>
  <script>

    const codeModal = document.getElementById('code-modal');
    const sourceCode = document.getElementById('source-code');

    // Show the original HTML source in the viewer.
    sourceCode.textContent = `__SOURCE_PLACEHOLDER__`;

    document.getElementById('view-code-btn').addEventListener('click', () => {
      codeModal.classList.add('open');
      codeModal.setAttribute('aria-hidden', 'false');
    });

    document.getElementById('close-code-btn').addEventListener('click', () => {
      codeModal.classList.remove('open');
      codeModal.setAttribute('aria-hidden', 'true');
    });

    codeModal.addEventListener('click', (event) => {
      if (event.target === codeModal) {
        codeModal.classList.remove('open');
        codeModal.setAttribute('aria-hidden', 'true');
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const anchor = document.querySelector('a[aria-label="Download latest release zip"]');
      if (!anchor) return;
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const resp = await fetch(
          'https://api.github.com/repos/jaxread/Clove-Engine/releases/latest',
          { signal: controller.signal }
        );
        clearTimeout(timeoutId);
        if (!resp.ok) return; // e.g. 404 if the repo has no published releases yet
        const release = await resp.json();
        const assets = Array.isArray(release.assets) ? release.assets : [];
        const zipAsset = assets.find(
          a => a && typeof a.name === 'string' && a.name.toLowerCase().endsWith('.zip')
        );
        let downloadUrl = null;
        if (zipAsset && zipAsset.browser_download_url) {
          downloadUrl = zipAsset.browser_download_url;
        } else if (release.tag_name) {
          downloadUrl = `https://github.com/jaxread/Clove-Engine/archive/refs/tags/${encodeURIComponent(release.tag_name)}.zip`;
        }
        if (downloadUrl) {
          anchor.setAttribute('href', downloadUrl);
        }
      } catch (err) {
        // Fail silently — the hardcoded fallback link stays in place
        console.debug('Failed to update download link:', err);
      }
    });
  </script>
</body>
</html>
